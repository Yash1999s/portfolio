<script>
   window.addEventListener("scroll", function () {

        const section = document.querySelector(".first_section");
        const overlay = document.querySelector(".first_section::after");
        const content = document.querySelector(".first_section_content");

        let scrollTop = window.scrollY;
        let sectionHeight = section.offsetHeight;

        // opacity calculate
        let progress = scrollTop / sectionHeight;

        if(progress > 1){
            progress = 1;
        }

        // text fade
        content.style.opacity = 1 - progress;
        content.style.transform = `
            translateY(-${scrollTop * 0.2}px)
            scale(${1 - scrollTop * 0.0003})
        `;

        content.style.filter = `blur(${scrollTop * 0.03}px)`;

        // bg white effect
        section.style.setProperty('--overlay-opacity', progress);
        section.style.backgroundColor = `rgba(255,255,255,${progress})`;
        section.style.zIndex = 3 - Math.floor(progress * 3);

        section.style.backgroundBlendMode = "lighten";

    });
</script>
